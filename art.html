
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art | En Luo</title>

  <style>
    :root {
      --blue: #7b949c;
      --navy: #1c2851;
      --cream: #f2e7d1;
      --muted: #526a79;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--blue);
      color: var(--navy);
      font-family: Georgia, "Times New Roman", serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    /* =========================
       HEADER
    ========================= */

    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 28px;
      padding: 34px clamp(24px, 4vw, 72px);
      background: var(--blue);
    }

    .site-name {
      color: #4d7087;
      font-size: clamp(30px, 2.7vw, 46px);
      font-weight: bold;
      line-height: 1;
    }

    .site-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: clamp(20px, 2.5vw, 46px);
    }

    .site-nav a {
      font-size: clamp(17px, 1.35vw, 23px);
      color: var(--navy);
      transition: opacity 0.2s;
    }

    .site-nav a:hover,
    .site-nav a[aria-current="page"] {
      opacity: 0.65;
    }

    /* =========================
       TITLE AND DESCRIPTION
       BLUE BACKGROUND
    ========================= */

    .intro {
      width: min(1714px, calc(100% - 72px));
      margin: 0 auto;
      padding: 70px 0 85px;
    }

    .intro h1 {
      margin: 0;
      font-size: clamp(58px, 5.8vw, 110px);
      font-weight: bold;
      letter-spacing: -0.045em;
      line-height: 1.07;
    }

    .intro p {
      margin: 45px 0 0;
      max-width: 1640px;
      font-size: clamp(19px, 1.55vw, 28px);
      line-height: 1.44;
    }

    /* =========================
       CREAM GALLERY PANEL
    ========================= */

    .gallery-panel {
      width: min(1800px, calc(100% - 96px));
      margin: 0 auto 72px;
      padding: clamp(22px, 4vw, 58px);
      background: var(--cream);
      border-radius: 38px;
    }

    /* Masonry-style gallery */

    .gallery {
      columns: 3;
      column-gap: 30px;
    }

    .artwork {
      display: inline-block;
      width: 100%;
      vertical-align: top;
      margin: 0 0 33px;
      break-inside: avoid;
      -webkit-column-break-inside: avoid;
    }

    .artwork-button {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
    }

    .artwork-visual {
      display: block;
      width: 100%;
      overflow: hidden;
      background: #e8dcc4;
      border-radius: 5px;
    }

    /* IMPORTANT:
       All images keep their natural
       aspect ratios and are not cropped.
    */

    .artwork-visual img {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      aspect-ratio: auto;
      object-fit: contain;
      transition: transform 0.25s ease;
    }

    .artwork-button:hover .artwork-visual img {
      transform: scale(1.02);
    }

    /* =========================
       IMAGE PLACEHOLDER
       (Only if an image is missing)
    ========================= */

    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      min-height: 220px;
      background: #e6d9bf;
      color: #7e837d;
      border: 1px solid rgba(28, 40, 81, 0.09);
    }

    .placeholder-number {
      font-size: 36px;
      color: #89918b;
    }

    .placeholder-label {
      font: 11px Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.13em;
    }

    /* =========================
       ARTWORK CAPTIONS
    ========================= */

    .caption {
      display: block;
      padding: 11px 2px 0;
    }

    .caption-title {
      display: block;
      font-size: 19px;
      line-height: 1.3;
      color: var(--navy);
    }

    .caption-details {
      display: block;
      margin-top: 3px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
    }

    /* =========================
       FULL-SIZE IMAGE VIEWER
    ========================= */

    .lightbox {
      width: min(1050px, calc(100vw - 32px));
      max-height: 94vh;
      border: 0;
      border-radius: 12px;
      padding: 0;
      background: var(--cream);
      color: var(--navy);
    }

    .lightbox::backdrop {
      background: rgba(15, 25, 49, 0.82);
    }

    .lightbox-content {
      padding: 24px;
    }

    .lightbox-top {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }

    .lightbox-close {
      background: transparent;
      border: 0;
      font-size: 30px;
      line-height: 1;
      color: var(--navy);
    }

    .lightbox-image {
      display: flex;
      align-items: center;
      justify-content: center;
      max-height: 68vh;
      overflow: auto;
    }

    .lightbox-image img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 68vh;
      object-fit: contain;
    }

    .lightbox-image .placeholder {
      width: min(100%, 540px);
      min-height: 260px;
    }

    .lightbox-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding-top: 17px;
    }

    .lightbox-title {
      margin: 0;
      font-size: 23px;
    }

    .lightbox-details {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .lightbox-description {
      margin: 8px 0 0;
      font-size: 15px;
    }

    .lightbox-description:empty {
      display: none;
    }

    .lightbox-controls {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .lightbox-controls button {
      border: 1px solid #b6b2a6;
      background: transparent;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      font-size: 21px;
    }

    .lightbox-controls button:hover {
      background: rgba(255,255,255,0.6);
    }

    .lightbox-count {
      white-space: nowrap;
      font: 12px Arial, sans-serif;
    }

    /* =========================
       TABLET
    ========================= */

    @media (max-width: 900px) {
      .gallery {
        columns: 2;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 620px) {

      .site-header {
        flex-direction: column;
        align-items: flex-start;
        padding: 25px 22px;
      }

      .site-nav {
        gap: 15px 24px;
      }

      .intro {
        width: calc(100% - 44px);
        padding: 43px 0 52px;
      }

      .intro h1 {
        font-size: clamp(43px, 11vw, 68px);
      }

      .intro p {
        margin-top: 22px;
        font-size: 18px;
      }

      .gallery-panel {
        width: calc(100% - 28px);
        padding: 24px 18px;
        border-radius: 25px;
        margin-bottom: 35px;
      }

      .gallery {
        columns: 1;
      }

      .lightbox-bottom {
        align-items: flex-start;
        flex-direction: column;
      }

      .lightbox-content {
        padding: 15px;
      }

      .lightbox-image img {
        max-height: 60vh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .artwork-visual img {
        transition: none;
      }
    }

  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header class="site-header">

    <a class="site-name" href="index.html">
      En Luo
    </a>

    <nav class="site-nav" aria-label="Main navigation">

      <a href="index.html">Home</a>

      <a href="research.html">Research</a>

      <a href="art.html" aria-current="page">Art</a>

      <a href="music.html">Music</a>

    </nav>

  </header>

  <!-- =========================
       MAIN PAGE
  ========================= -->

  <main>

    <!-- Title and introduction on blue background -->

    <section class="intro">

      <h1>Some of My Art</h1>

      <p>
        A variety of mediums including chalk pastel, watercolors,
        charcoal, pencil, trois crayons, and oil.
        Some are studies and master copies, while others are
        completed in art studio or independently.
      </p>

    </section>

    <!-- Only the artworks are inside the cream panel -->

    <section
      class="gallery-panel"
      aria-label="Art gallery"
    >

      <div class="gallery" id="gallery"></div>

    </section>

  </main>

  <!-- =========================
       ARTWORK VIEWER
  ========================= -->

  <dialog
    class="lightbox"
    id="lightbox"
    aria-labelledby="lightbox-title"
  >

    <div class="lightbox-content">

      <div class="lightbox-top">

        <button
          class="lightbox-close"
          id="close"
          aria-label="Close artwork"
        >
          &times;
        </button>

      </div>

      <div
        class="lightbox-image"
        id="lightbox-image"
      ></div>

      <div class="lightbox-bottom">

        <div>

          <h2
            class="lightbox-title"
            id="lightbox-title"
          ></h2>

          <p
            class="lightbox-details"
            id="lightbox-details"
          ></p>

          <p
            class="lightbox-description"
            id="lightbox-description"
          ></p>

        </div>

        <div class="lightbox-controls">

          <button
            id="previous"
            aria-label="Previous artwork"
          >
            &larr;
          </button>

          <span
            class="lightbox-count"
            id="lightbox-count"
          ></span>

          <button
            id="next"
            aria-label="Next artwork"
          >
            &rarr;
          </button>

        </div>

      </div>

    </div>

  </dialog>

  <script>

    /* =====================================
       YOUR 11 ARTWORKS

       The images are located in:
       files/art/

       The order matches your requested list.

       No fixed ratios:
       Each image displays in its
       original proportions.

       You can edit the title, medium,
       year, and description below.
    ===================================== */

    const artworks = [

      /* 1. STILL LIFE */

      {
        title: "Still Life #1",
        medium: "Pastel",
        year: "2026",
        image: "files/art/" +
          encodeURIComponent("Still Life #1.jpg"),
        description: ""
      },

      /* 2. SELF-PORTRAIT */

      {
        title: "Self-portrait",
        medium: "Trois crayons",
        year: "2025",
        image: "files/art/" +
          encodeURIComponent("Self-portrait.jpg"),
        description: ""
      },

      /* 3. GUANAJUATO */

      {
        title: "Guanajuato #1",
        medium: "Pastel",
        year: "2026",
        image: "files/art/" +
          encodeURIComponent("Guanajuato #1.jpg"),
        description: ""
      },

      /* 4. FRITS THAULOW */

      {
        title: "Mastercopy of Frits Thaulow",
        medium: "Pastel",
        year: "2025",
        image: "files/art/" +
          encodeURIComponent("Mastercopy Frits Thaulow.jpg"),
        description: ""
      },

      /* 5. THE BUTTERFLY DREAM */

      {
        title: "The Butterfly Dream",
        medium: "Charcoal + Pastel",
        year: "2025",
        image: "files/art/" +
          encodeURIComponent("The Butterfly Dream.jpg"),
        description: ""
      },

      /* 6. CHIEN CHUNG-WEI */

      {
        title: "Mastercopy of Chien Chung-Wei",
        medium: "Watercolor",
        year: "2026",
        image: "files/art/" +
          encodeURIComponent(
            "Mastercopy Chien Chung-Wei, Old Town.jpg"
          ),
        description: ""
      },

      /* 7. JACOB ZBUKVIC */

      {
        title: "Mastercopy of Jacob Zbukvic",
        medium: "Watercolor",
        year: "2026",
        image: "files/art/" +
          encodeURIComponent("Mastercopy Jacob Zbukvic.jpg"),
        description: ""
      },

      /* 8. GAZE */

      {
        title: "Gaze",
        medium: "Pencil",
        year: "2024",
        image: "files/art/" +
          encodeURIComponent("Gaze.jpg"),
        description: ""
      },

      /* 9. PIG */

      {
        title: "Pig",
        medium: "Oil",
        year: "2023",
        image: "files/art/" +
          encodeURIComponent("Pig.jpg"),
        description: ""
      },

      /* 10. SUNFLOWERS */

      {
        title: "Sunflowers",
        medium: "Oil",
        year: "2022",
        image: "files/art/" +
          encodeURIComponent("Sunflowers.jpg"),
        description: ""
      },

      /* 11. BLOOM */

      {
        title: "Bloom",
        medium: "Oil",
        year: "2022",
        image: "files/art/" +
          encodeURIComponent("Bloom.jpg"),
        description: ""
      }

    ];

    /* =====================================
       GALLERY JAVASCRIPT

       No changes needed below.
    ===================================== */

    const gallery =
      document.getElementById("gallery");

    const dialog =
      document.getElementById("lightbox");

    const lightboxImage =
      document.getElementById("lightbox-image");

    let currentIndex = 0;

    /* Create a placeholder if
       an image cannot be loaded */

    function makePlaceholder(index) {

      const placeholder =
        document.createElement("div");

      placeholder.className = "placeholder";

      const number =
        document.createElement("span");

      number.className = "placeholder-number";

      number.textContent =
        String(index + 1).padStart(2, "0");

      const label =
        document.createElement("span");

      label.className = "placeholder-label";
      label.textContent = "Artwork unavailable";

      placeholder.append(number, label);

      return placeholder;
    }

    /* Create an actual image */

    function makeVisual(work, index, enlarged = false) {

      if (!work.image) {
        return makePlaceholder(index);
      }

      const image =
        document.createElement("img");

      image.src = work.image;
      image.alt = work.title;

      image.loading = enlarged ? "eager" : "lazy";

      image.decoding = "async";

      image.addEventListener("error", () => {
        image.replaceWith(makePlaceholder(index));
      }, { once: true });

      return image;
    }

    /* =====================================
       RENDER ALL ARTWORKS
    ===================================== */

    function renderGallery() {

      gallery.replaceChildren();

      artworks.forEach((work, index) => {

        const card =
          document.createElement("article");

        card.className = "artwork";

        const button =
          document.createElement("button");

        button.className = "artwork-button";
        button.type = "button";

        button.setAttribute(
          "aria-label",
          `View ${work.title}`
        );

        /* Artwork image */

        const visual =
          document.createElement("span");

        visual.className = "artwork-visual";

        visual.append(
          makeVisual(work, index)
        );

        /* Artwork caption */

        const caption =
          document.createElement("span");

        caption.className = "caption";

        const title =
          document.createElement("span");

        title.className = "caption-title";
        title.textContent = work.title;

        const details =
          document.createElement("span");

        details.className = "caption-details";

        details.textContent =
          `${work.medium} · ${work.year}`;

        caption.append(title, details);

        button.append(visual, caption);

        button.addEventListener("click", () => {
          openArtwork(index);
        });

        card.append(button);

        gallery.append(card);

      });

    }

    /* =====================================
       ENLARGED IMAGE VIEWER
    ===================================== */

    function showArtwork(index) {

      currentIndex =
        (index + artworks.length) % artworks.length;

      const work = artworks[currentIndex];

      /* Show full-sized image */

      lightboxImage.replaceChildren(
        makeVisual(work, currentIndex, true)
      );

      /* Title */

      document.getElementById(
        "lightbox-title"
      ).textContent = work.title;

      /* Medium and year */

      document.getElementById(
        "lightbox-details"
      ).textContent =
        `${work.medium} · ${work.year}`;

      /* Optional description */

      document.getElementById(
        "lightbox-description"
      ).textContent = work.description || "";

      /* Position */

      document.getElementById(
        "lightbox-count"
      ).textContent =
        `${currentIndex + 1} / ${artworks.length}`;

    }

    /* Open artwork */

    function openArtwork(index) {

      showArtwork(index);

      dialog.showModal();

    }

    /* Close viewer */

    document.getElementById("close")
      .addEventListener("click", () => {

        dialog.close();

      });

    /* Previous artwork */

    document.getElementById("previous")
      .addEventListener("click", () => {

        showArtwork(currentIndex - 1);

      });

    /* Next artwork */

    document.getElementById("next")
      .addEventListener("click", () => {

        showArtwork(currentIndex + 1);

      });

    /* Keyboard arrow navigation */

    document.addEventListener("keydown", (event) => {

      if (!dialog.open) return;

      if (event.key === "ArrowLeft") {
        showArtwork(currentIndex - 1);
      }

      if (event.key === "ArrowRight") {
        showArtwork(currentIndex + 1);
      }

    });

    /* Close when clicking outside viewer */

    dialog.addEventListener("click", (event) => {

      if (event.target === dialog) {
        dialog.close();
      }

    });

    /* Initialize gallery */

    renderGallery();

  </script>

</body>
</html>
